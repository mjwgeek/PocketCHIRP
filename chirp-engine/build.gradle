plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// PocketCHIRP CHIRP Engine 2.0.5 - public corresponding-source build.
//
// IMPORTANT:
// This is the MODULE build file:
//     <project>\chirp-engine\build.gradle
//
// It is NOT the project-root build.gradle.
//
// This module is the separately distributed GPL CHIRP Engine package.

def chirpProps = new java.util.Properties()
def chirpPropsFile = rootProject.file('chirp-version.properties')
if (!chirpPropsFile.exists()) {
    throw new GradleException('Missing chirp-version.properties')
}
chirpPropsFile.withInputStream { chirpProps.load(it) }

def chirpCommit = (chirpProps.getProperty('CHIRP_COMMIT') ?: '').trim()
if (!(chirpCommit ==~ /[0-9a-fA-F]{40}/)) {
    throw new GradleException('Invalid CHIRP_COMMIT in chirp-version.properties')
}

def vendoredChirpDir = file('src/main/python/chirp')
def vendoredCommitFile = file('third_party/chirp/UPSTREAM_COMMIT.txt')

// Release signing is intentionally not part of the public source tree.
// Build an unsigned APK/AAB from source, or supply your own signing configuration.

android {
    namespace = 'com.wg5eek.pocketchirp.engine'
    compileSdk 36

    buildFeatures {
        aidl = true
    }

    defaultConfig {
        applicationId 'com.wg5eek.pocketchirp.engine'
        minSdk 24
        targetSdk 36

        // Previous Google Play Engine build was versionCode 3.
        versionCode 18
        versionName '2.0.5'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.10'
        pyc { src = false }

        // CHIRP and bridge.py are packaged directly from the LOCAL engine tree.
        // There is intentionally no pip/Git/GitHub dependency here.
    }
}

tasks.register('verifyVendoredChirp') {
    doLast {
        if (!vendoredChirpDir.isDirectory()) {
            throw new GradleException(
                    'Vendored CHIRP source is missing. Run .\\tools\\vendor-chirp.ps1'
            )
        }

        def required = [
                file('src/main/python/chirp/__init__.py'),
                file('src/main/python/chirp/chirp_common.py'),
                file('src/main/python/chirp/directory.py'),
                file('src/main/python/chirp/drivers/__init__.py'),
                vendoredCommitFile,
                file('third_party/chirp/COPYING')
        ]

        def missing = required.findAll { !it.exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Vendored CHIRP source is incomplete: ' +
                            missing.collect { it.path }.join(', ') +
                            '. Run .\\tools\\vendor-chirp.ps1'
            )
        }

        def vendoredCommit = vendoredCommitFile.getText('UTF-8').trim()
        if (!vendoredCommit.equalsIgnoreCase(chirpCommit)) {
            throw new GradleException(
                    "Vendored CHIRP is ${vendoredCommit}, but chirp-version.properties " +
                            "pins ${chirpCommit}. Run .\\tools\\vendor-chirp.ps1"
            )
        }

        def drivers = fileTree('src/main/python/chirp/drivers') {
            include '*.py'
        }.files.size()

        if (drivers < 50) {
            throw new GradleException(
                    "Vendored CHIRP driver tree looks incomplete (${drivers} Python files). " +
                            '. Run .\\tools\\vendor-chirp.ps1'
            )
        }

        logger.lifecycle(
                "PocketCHIRP CHIRP Engine: using LOCAL vendored CHIRP ${vendoredCommit} " +
                        "(${drivers} driver files); no pip/Git/GitHub build dependency"
        )
    }
}

// BUILD-SPEED SAFEGUARD:
// Do not scan the full vendored CHIRP tree on every debug/incremental build.
// The integrity check is required for RELEASE builds, where it matters.
// Normal development builds use the already-vendored local files directly.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn('verifyVendoredChirp')
}
