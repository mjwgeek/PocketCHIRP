plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// PocketCHIRP CHIRP Engine 2.0.8a - RELEASE build.
//
// IMPORTANT:
// This is the MODULE build file:
//     <project>\chirp-engine\build.gradle
//
// It is NOT the project-root build.gradle.
//
// This module is the separately distributed GPL CHIRP Engine package.

def chirpProps = new java.util.Properties()
def chirpPropsFile = rootProject.file('chirp-version.properties')
if (!chirpPropsFile.exists()) {
    throw new GradleException('Missing chirp-version.properties')
}
chirpPropsFile.withInputStream { chirpProps.load(it) }

def chirpCommit = (chirpProps.getProperty('CHIRP_COMMIT') ?: '').trim()
if (!(chirpCommit ==~ /[0-9a-fA-F]{40}/)) {
    throw new GradleException('Invalid CHIRP_COMMIT in chirp-version.properties')
}

def vendoredChirpDir = file('src/main/python/chirp')
def vendoredCommitFile = file('third_party/chirp/UPSTREAM_COMMIT.txt')

// Release signing values are stored in the PROJECT ROOT local.properties.
def localProps = new java.util.Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def releaseStorePassword =
        (localProps.getProperty('POCKETCHIRP_RELEASE_STORE_PASSWORD') ?: '').trim()

def releaseKeyPassword =
        (localProps.getProperty('POCKETCHIRP_RELEASE_KEY_PASSWORD') ?: '').trim()

def releaseKeystore = file('C:/Users/xtrem/Documents/Android Keys/PocketCHIRP-upload')

android {
    namespace = 'com.wg5eek.pocketchirp.engine'
    compileSdk 36

    buildFeatures {
        aidl = true
    }

    defaultConfig {
        applicationId 'com.wg5eek.pocketchirp.engine'
        minSdk 24
        targetSdk 36

        // Previous Google Play Engine build was versionCode 3.
        versionCode 27
        versionName '2.0.8'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword releaseStorePassword
            keyAlias 'pocketchirp-upload'
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.10'
        pyc { src = false }

        // CHIRP and bridge.py are packaged directly from the LOCAL engine tree.
        // There is intentionally no pip/Git/GitHub dependency here.
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseKeystore.exists()) {
            throw new GradleException(
                    "PocketCHIRP release keystore not found: ${releaseKeystore}"
            )
        }
        if (releaseStorePassword.isEmpty()) {
            throw new GradleException(
                    'Missing POCKETCHIRP_RELEASE_STORE_PASSWORD in root local.properties'
            )
        }
        if (releaseKeyPassword.isEmpty()) {
            throw new GradleException(
                    'Missing POCKETCHIRP_RELEASE_KEY_PASSWORD in root local.properties'
            )
        }
    }
}

tasks.register('verifyVendoredChirp') {
    doLast {
        if (!vendoredChirpDir.isDirectory()) {
            throw new GradleException(
                    'Vendored CHIRP source is missing. Run .\\tools\\vendor-chirp.ps1'
            )
        }

        def required = [
                file('src/main/python/chirp/__init__.py'),
                file('src/main/python/chirp/chirp_common.py'),
                file('src/main/python/chirp/directory.py'),
                file('src/main/python/chirp/drivers/__init__.py'),
                vendoredCommitFile,
                file('third_party/chirp/COPYING')
        ]

        def missing = required.findAll { !it.exists() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Vendored CHIRP source is incomplete: ' +
                            missing.collect { it.path }.join(', ') +
                            '. Run .\\tools\\vendor-chirp.ps1'
            )
        }

        def vendoredCommit = vendoredCommitFile.getText('UTF-8').trim()
        if (!vendoredCommit.equalsIgnoreCase(chirpCommit)) {
            throw new GradleException(
                    "Vendored CHIRP is ${vendoredCommit}, but chirp-version.properties " +
                            "pins ${chirpCommit}. Run .\\tools\\vendor-chirp.ps1"
            )
        }

        def drivers = fileTree('src/main/python/chirp/drivers') {
            include '*.py'
        }.files.size()

        if (drivers < 50) {
            throw new GradleException(
                    "Vendored CHIRP driver tree looks incomplete (${drivers} Python files). " +
                            '. Run .\\tools\\vendor-chirp.ps1'
            )
        }

        logger.lifecycle(
                "PocketCHIRP CHIRP Engine: using LOCAL vendored CHIRP ${vendoredCommit} " +
                        "(${drivers} driver files); no pip/Git/GitHub build dependency"
        )
    }
}

// BUILD-SPEED SAFEGUARD:
// Do not scan the full vendored CHIRP tree on every debug/incremental build.
// The integrity check is required for RELEASE builds, where it matters.
// Normal development builds use the already-vendored local files directly.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn('verifyVendoredChirp')
    dependsOn('verifyReleaseSigning')
}

// ---------------------------------------------------------------------------
// FAST FIRST-LAUNCH RADIO CATALOG
// ---------------------------------------------------------------------------
// Generate a neutral chooser catalog into the GPL Engine's Python package at
// build time. Runtime radio operations still use bridge.radio_catalog_json(),
// which remains authoritative and imports/registers CHIRP normally.
def prebuiltCatalogFile = file('src/main/python/prebuilt_radio_catalog.json')
def catalogGenerator = file('tools/generate-radio-catalog.py')

tasks.register('generatePrebuiltRadioCatalog') {
    inputs.file(catalogGenerator)
    inputs.file(file('src/main/python/bridge.py'))
    inputs.dir(vendoredChirpDir)
    inputs.property('chirpCommit', chirpCommit)
    outputs.file(prebuiltCatalogFile)

    doLast {
        if (!catalogGenerator.isFile()) {
            throw new GradleException('Missing chirp-engine/tools/generate-radio-catalog.py')
        }

        def isWindows = System.getProperty('os.name', '')
                .toLowerCase(java.util.Locale.ROOT)
                .contains('windows')
        def candidates = isWindows
                ? [['py', '-3'], ['python'], ['python3']]
                : [['python3'], ['python']]

        Exception lastFailure = null
        boolean generated = false

        for (def prefix : candidates) {
            try {
                def command = []
                command.addAll(prefix)
                command.add(catalogGenerator.absolutePath)
                command.add('--python-root')
                command.add(file('src/main/python').absolutePath)
                command.add('--output')
                command.add(prebuiltCatalogFile.absolutePath)
                command.add('--chirp-commit')
                command.add(chirpCommit)

                def result = providers.exec {
                    commandLine command
                    ignoreExitValue = true
                }.result.get()

                if (result.exitValue == 0 && prebuiltCatalogFile.isFile()) {
                    generated = true
                    break
                }
            } catch (Exception e) {
                lastFailure = e
            }
        }

        if (!generated) {
            throw new GradleException(
                    'Could not generate the Engine prebuilt radio catalog. ' +
                    'Install Python 3 on the build machine and ensure the vendored ' +
                    'CHIRP tree can be imported.' +
                    (lastFailure == null ? '' : ' Last error: ' + lastFailure.message)
            )
        }
    }
}

// Inputs/outputs keep normal incremental builds fast: the catalog regenerates
// only when bridge.py, the vendored CHIRP tree, generator, or CHIRP pin changes.
tasks.matching { it.name == 'preDebugBuild' || it.name == 'preReleaseBuild' }.configureEach {
    dependsOn('generatePrebuiltRadioCatalog')
}

// Chaquopy reads src/main/python when it merges Python sources. The generated
// catalog is written into that same source tree, so Gradle 9.x requires the
// merge task to declare the generator as an explicit dependency.
tasks.matching { it.name == 'mergeDebugPythonSources' || it.name == 'mergeReleasePythonSources' }.configureEach {
    dependsOn('generatePrebuiltRadioCatalog')
}
