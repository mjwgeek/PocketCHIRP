name: Publish latest CHIRP Engine source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-latest-chirp-engine.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CHIRP Engine source only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import re
          import tokenize

          root = Path('chirp-engine')
          bridge = root / 'src/main/python/bridge.py'
          radtel = root / 'src/main/python/chirp/drivers/radtel_rt900.py'

          # Keep the already-published 266 engine bridge. It contains the newest
          # universal serial-read and driver-settings capability fixes.
          bridge_text = bridge.read_text(encoding='utf-8')
          expected = 'POCKETCHIRP_BRIDGE_REVISION = "266-p247-universal-read-settings-capability"'
          if expected not in bridge_text:
              raise SystemExit('Refusing to publish: current CHIRP Engine bridge is not revision 266')

          manifest = '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!--
                PocketCHIRP 2.x architecture:
                The proprietary PocketCHIRP application and GPL CHIRP runtime are
                distributed as separate APKs/packages. The CHIRP runtime and bundled
                radio drivers belong in this engine package and must not be re-embedded
                into the PocketCHIRP application module.

                IMPORTANT:
                PocketCHIRP and PocketCHIRP CHIRP Engine are separate Google Play
                listings and may be signed by different Play App Signing certificates.
                Do NOT protect this service with a signature-level manifest permission:
                Android would reject the bind before our Binder code can authenticate
                PocketCHIRP.

                Access control is enforced inside PocketChirpEngineService on every
                Binder call by verifying that the calling UID owns the exact package
                com.wg5eek.pocketchirp.
              -->

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="PocketCHIRP CHIRP Engine"
                  android:usesCleartextTraffic="false">

                  <!--
                    Launcher stub only. The Engine has no standalone user interface.
                    If launched directly, EngineInfoActivity immediately finishes and
                    removes its task without starting or changing the CHIRP Engine service.

                    The launcher remains present so the companion APK retains a normal
                    launchable Play Store-visible application entry.
                  -->
                  <activity
                      android:name=".EngineInfoActivity"
                      android:exported="true"
                      android:label="PocketCHIRP CHIRP Engine"
                      android:theme="@android:style/Theme.NoDisplay"
                      android:noHistory="true"
                      android:excludeFromRecents="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!--
                    Exported so the separately signed PocketCHIRP package can bind.
                    Authorization is deliberately performed by PocketChirpEngineService
                    at the Binder transaction boundary, where Binder.getCallingUid()
                    identifies the real caller.
                  -->
                  <service
                      android:name=".PocketChirpEngineService"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.wg5eek.pocketchirp.CHIRP_ENGINE" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          '''
          # Remove indentation introduced only by this workflow's embedded Python block.
          import textwrap
          manifest = textwrap.dedent(manifest)
          (root / 'src/main/AndroidManifest.xml').write_text(manifest, encoding='utf-8')

          engine_info = '''package com.wg5eek.pocketchirp.engine;

          import android.app.Activity;
          import android.os.Bundle;

          /**
           * Launcher stub for the PocketCHIRP CHIRP Engine.
           *
           * The engine is a companion/service APK and has no standalone UI. If a user
           * launches its icon directly, close the launcher task immediately and quietly.
           * This does not start, stop, bind, or otherwise alter PocketChirpEngineService.
           */
          public final class EngineInfoActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Remove the launcher task completely so there is no blank Activity
                  // left behind in Recents and no visible error/UI for direct launches.
                  finishAndRemoveTask();
              }
          }
          '''
          engine_info = textwrap.dedent(engine_info)
          info_path = root / 'src/main/java/com/wg5eek/pocketchirp/engine/EngineInfoActivity.java'
          info_path.parent.mkdir(parents=True, exist_ok=True)
          info_path.write_text(engine_info, encoding='utf-8')

          # Add the PocketCHIRP Zastone retail-model registration without changing the
          # proven common RT-900/GS-10B protocol implementation.
          rtext = radtel.read_text(encoding='utf-8')
          if 'class ZastoneZTM8' not in rtext:
              marker = '@directory.register\nclass BJ7800(RT920):'
              if marker not in rtext:
                  raise SystemExit('Unable to locate BJ7800 insertion point in radtel_rt900.py')
              ztm8 = r'''@directory.register
          class ZastoneZTM8(RadioddityGS10B):
              # =====================================================================
              # NO-REGRESSION CONTRACT — ZASTONE ZT-M8
              # =====================================================================
              # ZT-M8 is an isolated retail-model registration on the already proven
              # 256-channel BT8000/GS-10B clone family. Do NOT move any of these values
              # into RT900BT/RadioddityGS10B or alter their common read/write functions:
              # RT-900/910/920, BJ7800 and GS-10B are known-good and must keep their
              # existing paths byte-for-byte.
              #
              # Recovered vendor evidence identifies ZT-M8 as PROGRAMBT80U / BT8000
              # family with 256 channels. The proven serial clone rate for the CHIRP
              # transport is 57600 baud. PocketCHIRP applies its ZT-M8 read-before-write
              # safety token in the app; this driver injects no model-specific write bytes.
              # =====================================================================
              """Zastone ZT-M8 — 256-channel BT8000-family radio."""
              VENDOR = "Zastone"
              MODEL = "ZT-M8"
              BAUD_RATE = 57600

              @classmethod
              def get_prompts(cls):
                  rp = super().get_prompts()
                  rp.experimental = (
                      'Experimental Zastone ZT-M8 support using the proven 256-channel '
                      'PROGRAMBT80U / BT8000-family clone protocol.\n\n'
                      'Download from the radio first and keep the unedited backup before '
                      'writing. PocketCHIRP will block ZT-M8 writes until a successful '
                      'physical read has completed for the selected radio.\n\n'
                      'PROCEED AT YOUR OWN RISK!'
                  )
                  return rp


          '''
              ztm8 = textwrap.dedent(ztm8)
              rtext = rtext.replace(marker, ztm8 + marker, 1)
              radtel.write_text(rtext, encoding='utf-8')

          # Comments only: strip references to unrelated programming apps/projects.
          # Executable code, strings, docstrings, driver metadata and license headers
          # are intentionally left untouched.
          foreign = re.compile(
              r'webchirp|odmaster|rt\s*systems|rtsystems|ola\s+radio|radiodroid|'
              r'oem\s+(?:app|cps)|factory\s+cps|programming\s+software',
              re.I,
          )

          def remove_python_comment_tokens(path: Path):
              data = path.read_text(encoding='utf-8')
              lines = data.splitlines(keepends=True)
              replacements = []
              try:
                  tokens = list(tokenize.generate_tokens(io.StringIO(data).readline))
              except (tokenize.TokenError, IndentationError):
                  return
              for tok in tokens:
                  if tok.type == tokenize.COMMENT and foreign.search(tok.string):
                      (sl, sc), (el, ec) = tok.start, tok.end
                      if sl == el:
                          replacements.append((sl - 1, sc, ec))
              for li, sc, ec in sorted(replacements, reverse=True):
                  line = lines[li]
                  lines[li] = line[:sc] + line[ec:]
              path.write_text(''.join(lines), encoding='utf-8')

          # First remove named-comment tokens throughout Python source.
          for path in root.rglob('*.py'):
              remove_python_comment_tokens(path)

          # Remove continuation lines belonging specifically to the old WebCHIRP/Ola
          # note blocks in bridge.py. This still changes comments only.
          def remove_named_comment_blocks(path: Path):
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              i = 0
              starters = re.compile(r'WEBCHIRP\s+NOTE:|Ola\s+Radio\s+direct-BLE\s+HCI\s+trace', re.I)
              while i < len(lines):
                  line = lines[i]
                  if line.lstrip().startswith('#') and starters.search(line):
                      i += 1
                      while i < len(lines) and lines[i].lstrip().startswith('#'):
                          i += 1
                      continue
                  out.append(line)
                  i += 1
              path.write_text(''.join(out), encoding='utf-8')

          # The named start lines may already have been stripped above, so also remove
          # known orphan continuation wording from those two historical note blocks.
          remove_named_comment_blocks(bridge)
          b = bridge.read_text(encoding='utf-8')
          orphan_phrases = (
              'already accumulates notifications',
              'download requests 0x80-byte',
          )
          cleaned = []
          for line in b.splitlines(keepends=True):
              if line.lstrip().startswith('#') and any(p.lower() in line.lower() for p in orphan_phrases):
                  continue
              cleaned.append(line)
          bridge.write_text(''.join(cleaned), encoding='utf-8')

          # Verify that no named unrelated-app reference remains in Python comments.
          leftovers = []
          for path in root.rglob('*.py'):
              data = path.read_text(encoding='utf-8')
              try:
                  tokens = tokenize.generate_tokens(io.StringIO(data).readline)
                  for tok in tokens:
                      if tok.type == tokenize.COMMENT and foreign.search(tok.string):
                          leftovers.append(f'{path}:{tok.start[0]}:{tok.string}')
              except (tokenize.TokenError, IndentationError):
                  pass
          if leftovers:
              raise SystemExit('Foreign-app comments remain:\n' + '\n'.join(leftovers[:30]))
          PY

          # Reuse the already-public PocketCHIRP artwork as the engine launcher icon.
          mkdir -p chirp-engine/src/main/res/mipmap-mdpi
          cp assets/PocketCHIRP-icon.jpg chirp-engine/src/main/res/mipmap-mdpi/ic_launcher.jpg
          cp assets/PocketCHIRP-icon.jpg chirp-engine/src/main/res/mipmap-mdpi/ic_launcher_round.jpg

          # Previous bridge-transfer staging is not part of the engine source.
          rm -rf .github/bridge264-temp

          # Source sanity checks. Do not alter protocol code for this publication pass.
          python -m py_compile \
            chirp-engine/src/main/python/bridge.py \
            chirp-engine/src/main/python/chirp/drivers/radtel_rt900.py \
            chirp-engine/src/main/python/chirp/drivers/generic_csv.py \
            chirp-engine/src/main/python/chirp/drivers/tdm11.py \
            chirp-engine/src/main/python/chirp/drivers/ft7100.py

          grep -q '266-p247-universal-read-settings-capability' chirp-engine/src/main/python/bridge.py
          grep -q 'class ZastoneZTM8' chirp-engine/src/main/python/chirp/drivers/radtel_rt900.py
          grep -q 'EngineInfoActivity' chirp-engine/src/main/AndroidManifest.xml
          ! grep -q 'android:permission="com.wg5eek.pocketchirp.permission.CHIRP_ENGINE"' chirp-engine/src/main/AndroidManifest.xml

          # The sanitized public module build must remain untouched.
          test "$(git hash-object chirp-engine/build.gradle)" = "98a402268c90de019a3b96e23089a10dfbd0716f"

          # Fail closed if private app keys/signing/local-machine values appear in
          # anything being published from the engine tree.
          if grep -RInE \
            'RADIOREFERENCE_APP_KEY|POCKETCHIRP_COMPAT_KEY|STRIPE_SECRET|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|C:/Users/|local\.properties|POCKETCHIRP_RELEASE_(STORE|KEY)_PASSWORD' \
            chirp-engine; then
            echo 'Refusing to publish: private/local configuration marker found.' >&2
            exit 1
          fi

          # Remove this one-shot publisher before the resulting source commit.
          git rm -f .github/workflows/publish-latest-chirp-engine.yml
          git add chirp-engine
          git add -u .github/bridge264-temp || true

          # Only CHIRP Engine source and deletion of temporary publisher/staging
          # artifacts may be part of the resulting commit.
          bad="$(git diff --cached --name-only | grep -Ev '^(chirp-engine/|\.github/bridge264-temp/|\.github/workflows/publish-latest-chirp-engine\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo "Refusing to publish unexpected paths:" >&2
            echo "$bad" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish latest CHIRP Engine source"
          git push origin HEAD:main
