name: Discover Community CHIRP Drivers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
      timezone: 'America/Chicago'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Discover candidate drivers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/discover_community_drivers.py

      - name: Add official IJV drivers
        run: python scripts/discover_ijv_official.py

      - name: Add version metadata
        run: python scripts/version_community_drivers.py

      - name: Refresh approval dropdown choices
        run: python scripts/generate_approval_workflow.py

      - name: Summarize discoveries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('community/candidates.json').read_text())
          rows = p.get('candidates', [])
          quansheng = [x for x in rows if 'quansheng' in (' '.join(x.get('vendors', [])) + ' ' + ' '.join(x.get('models', [])) + ' ' + x.get('repository', '') + ' ' + x.get('path', '')).lower() or 'uv-k' in (' '.join(x.get('models', [])) + ' ' + x.get('repository', '') + ' ' + x.get('path', '')).lower() or 'uvk' in (' '.join(x.get('models', [])) + ' ' + x.get('repository', '') + ' ' + x.get('path', '')).lower()]
          owned = [x for x in rows if x.get('repository', '').startswith('mjwgeek/')]
          ijv = [x for x in rows if x.get('repository') == 'ijvradio.com']
          current = [x for x in rows if not x.get('historical')]
          historical = [x for x in rows if x.get('historical')]
          versioned = [x for x in rows if x.get('version')]
          print(f"Total candidates: {len(rows)}")
          print(f"Current candidates: {len(current)}")
          print(f"Historical/version-specific candidates retained: {len(historical)}")
          print(f"Candidates with parsed version numbers: {len(versioned)}")
          print(f"Quansheng-related candidates: {len(quansheng)}")
          print(f"Official IJV candidates: {len(ijv)}")
          print(f"mjwgeek repository candidates: {len(owned)}")
          print('\nOfficial IJV:')
          for x in ijv:
              print(f"- {x.get('displayName')} :: {x.get('path')} :: {x.get('installPackaging')}")
          print('\nQuansheng-related:')
          for x in quansheng:
              flags = []
              if x.get('recommended'): flags.append('recommended')
              if x.get('historical'): flags.append('historical')
              version = f" v{x['version']}" if x.get('version') else ''
              flag_text = f" [{' / '.join(flags)}]" if flags else ''
              print(f"- {x.get('repository')} :: {x.get('path')} :: {', '.join(x.get('models', []))}{version}{flag_text}")
          print('\nOwned repository candidates:')
          for x in owned:
              version = f" v{x['version']}" if x.get('version') else ''
              print(f"- {x.get('repository')} :: {x.get('path')} :: {', '.join(x.get('models', []))}{version}")
          PY

      - name: Commit candidate and approval-choice changes
        run: |
          if git diff --quiet -- community/candidates.json .github/workflows/manage-community-driver-approval.yml; then
            echo "No candidate or approval-choice changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/candidates.json .github/workflows/manage-community-driver-approval.yml
          git commit -m "Update community CHIRP driver candidates and approval choices"
          git push
