name: Discover Official IJV Drivers

on:
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * *'

permissions:
  contents: write

concurrency:
  group: community-driver-catalog-write
  cancel-in-progress: false

jobs:
  discover-ijv:
    if: github.event_name != 'workflow_dispatch' || github.actor == 'mjwgeek'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Discover official IJV drivers
        run: python scripts/discover_ijv_official.py

      - name: Add version metadata
        run: python scripts/version_community_drivers.py

      - name: Commit IJV candidate changes
        run: |
          if git diff --quiet -- community/candidates.json community/ijv-mirror/; then
            echo "No official IJV candidate or mirrored-driver changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/candidates.json community/ijv-mirror/
          git commit -m "Update official IJV community driver candidates"
          git push
