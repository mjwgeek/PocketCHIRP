name: CardputerCHIRP M1 Build

on:
  push:
    branches:
      - cardputer-chirp-m1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18
      - name: Build Cardputer ADV firmware
        working-directory: .build/cardputer-chirp-project
        run: pio run -e cardputer-adv
      - name: Stage Launcher binary
        shell: bash
        run: |
          mkdir -p output
          cp .build/cardputer-chirp-project/.pio/build/cardputer-adv/firmware.bin output/CardputerCHIRP-M1.bin
          sha256sum output/CardputerCHIRP-M1.bin | tee output/CardputerCHIRP-M1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CardputerCHIRP-M1-Launcher
          path: output/
          retention-days: 3
