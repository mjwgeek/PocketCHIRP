name: Bulk Approve Current Community Driver Baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bulk-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Approve every current candidate
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          candidates = json.loads(Path('community/candidates.json').read_text()).get('candidates', [])
          approved = json.loads(Path('community/community-drivers.json').read_text()).get('drivers', [])
          approved_keys = {str(x.get('candidateKey') or '') for x in approved}
          keys = [str(x.get('candidateKey') or '') for x in candidates if x.get('candidateKey') and str(x.get('candidateKey')) not in approved_keys]

          print(f'Current candidates: {len(candidates)}')
          print(f'Already approved: {len(approved_keys)}')
          print(f'Approving now: {len(keys)}')

          if keys:
              subprocess.check_call([
                  sys.executable,
                  'scripts/manage_community_approvals.py',
                  'approve',
                  *keys,
                  '--note',
                  'Bulk-approved current discovery baseline',
              ])
          PY

      - name: Rebuild vendor approval/removal menus
        run: python scripts/generate_approval_workflow.py

      - name: Verify baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path('community/candidates.json').read_text()).get('candidates', [])
          approved = json.loads(Path('community/community-drivers.json').read_text()).get('drivers', [])
          approved_keys = {x.get('candidateKey') for x in approved}
          missing = [x.get('candidateKey') for x in candidates if x.get('candidateKey') not in approved_keys]
          print(f'Candidates: {len(candidates)}')
          print(f'Approved: {len(approved)}')
          print(f'Unapproved current candidates: {len(missing)}')
          if missing:
              raise SystemExit('Bulk approval incomplete')
          PY

      - name: Commit baseline and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/community-drivers.json .github/workflows/community-driver-*.yml
          git add -u .github/workflows
          git rm .github/workflows/bulk-approve-current-community.yml
          git commit -m "Bulk approve current community driver baseline"
          git push
