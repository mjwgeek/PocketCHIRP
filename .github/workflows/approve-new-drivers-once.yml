name: Approve New Installable Drivers Once

on:
  push:
    paths:
      - '.github/workflows/approve-new-drivers-once.yml'

permissions:
  contents: write

concurrency:
  group: pocketchirp-main-write
  cancel-in-progress: false

jobs:
  approve:
    if: github.actor == 'mjwgeek' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Approve new installable candidates
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          candidates = json.loads(Path('community/candidates.json').read_text()).get('candidates', [])
          approved = json.loads(Path('community/community-drivers.json').read_text()).get('drivers', [])
          approved_keys = {str(x.get('candidateKey') or '') for x in approved}
          allowed_hosts = {'raw.githubusercontent.com', 'www.ijvradio.com', 'ijvradio.com'}

          def installable(row):
              key = str(row.get('candidateKey') or '').strip()
              url = str(row.get('downloadUrl') or '').strip()
              sha = str(row.get('sha256') or '').strip().lower()
              if not key or not url or not re.fullmatch(r'[0-9a-f]{64}', sha):
                  return False
              parsed = urlparse(url)
              return parsed.scheme == 'https' and parsed.hostname in allowed_hosts

          keys = [str(x['candidateKey']) for x in candidates if installable(x) and str(x['candidateKey']) not in approved_keys]
          print(f'Installable unapproved candidates: {len(keys)}')
          for key in keys:
              print(f'- {key}')
          if keys:
              subprocess.check_call([
                  sys.executable,
                  'scripts/manage_community_approvals.py',
                  'approve',
                  *keys,
                  '--note',
                  'Approved new installable driver discovery',
              ])
          PY

      - name: Commit approvals
        run: |
          if git diff --quiet -- community/community-drivers.json; then
            echo "No new installable drivers to approve."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/community-drivers.json
          git commit -m "Approve new installable community drivers"
          git push
