name: One-shot bridge 266 p247 patch

on:
  push:
    paths:
      - '.github/workflows/temp-bridge-266-p247.yml'

permissions:
  contents: write

jobs:
  patch-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply exact cumulative bridge patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/bridge.patch
          git apply --check /tmp/bridge.patch
          git apply /tmp/bridge.patch
          python -m py_compile chirp-engine/src/main/python/bridge.py
      - name: Commit bridge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chirp-engine/src/main/python/bridge.py
          git commit -m "Fix universal serial reads and driver settings capability"
          git push origin HEAD:main
